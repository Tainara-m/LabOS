<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c5cfc"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0a0e17" stroke="url(#g)" stroke-width="3"/>
  <!-- Terminal window -->
  <rect x="12" y="16" width="40" height="32" rx="4" fill="#111827" stroke="#2a3548" stroke-width="1.5"/>
  <!-- Traffic lights -->
  <circle cx="18" cy="22" r="2.2" fill="#ff5f56"/>
  <circle cx="25" cy="22" r="2.2" fill="#ffbd2e"/>
  <circle cx="32" cy="22" r="2.2" fill="#27c93f"/>
  <!-- Prompt line -->
  <text x="16" y="34" font-family="monospace" font-size="7" font-weight="700" fill="#00e676">$</text>
  <rect x="22" y="29" width="18" height="5" rx="1" fill="url(#g2)" opacity="0.9"/>
  <!-- Cursor blink suggestion -->
  <rect x="42" y="29" width="2.5" height="5" rx="0.5" fill="#00d4ff"/>
  <!-- Bottom dots / status -->
  <circle cx="20" cy="42" r="1.5" fill="#00d4ff" opacity="0.8"/>
  <circle cx="26" cy="42" r="1.5" fill="#7c5cfc" opacity="0.8"/>
  <circle cx="32" cy="42" r="1.5" fill="#00e676" opacity="0.8"/>
</svg>
